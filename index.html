<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>نظام دُگّان - تحت الصيانة</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Cairo -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4 antialiased selection:bg-emerald-500 selection:text-white">

    <!-- Background Decorative Blobs -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none">
        <div class="absolute -top-24 -right-24 w-96 h-96 bg-emerald-500/10 rounded-full blur-3xl"></div>
        <div class="absolute -bottom-24 -left-24 w-96 h-96 bg-teal-500/10 rounded-full blur-3xl"></div>
    </div>

    <!-- Main Maintenance Card -->
    <div class="max-w-md w-full bg-slate-900/90 border border-slate-800/80 rounded-3xl p-8 text-center shadow-2xl relative z-10 space-y-6">
        
        <!-- Animated Icon -->
        <div class="w-20 h-20 rounded-2xl bg-gradient-to-tr from-emerald-600 to-teal-500 flex items-center justify-center text-white shadow-xl shadow-emerald-900/40 mx-auto">
            <i class="fa-solid fa-screwdriver-wrench text-3xl animate-bounce"></i>
        </div>
        
        <div class="space-y-2">
            <span class="text-xs uppercase tracking-wider bg-emerald-500/10 text-emerald-400 font-bold px-3.5 py-1.5 rounded-full border border-emerald-500/20 inline-block">
                قريباً جداً
            </span>
            <h1 class="font-black text-2xl tracking-tight text-white">نظام دُگّان تحت الصيانة</h1>
        </div>

        <p class="text-sm text-slate-300 leading-relaxed">
            عيني، جاي نشتغل على تحديثات وتطويرات جديدة للنظام حتى يكون بأفضل وأسرع شكل ممكن. من يكتمل كلشي، راح نبلش شغلنا براحتنا وبدون أي مشاكل! 🚀
        </p>

        <!-- Status Indicator -->
        <div class="pt-4 border-t border-slate-800/80 text-xs text-slate-400 flex items-center justify-center gap-2">
            <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
            <span>العمل جارٍ على قدم وساق... ترقبونا قريباً</span>
        </div>

    </div>

</body>
</html>
