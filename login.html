<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>تسجيل الدخول وإنشاء حساب - نظام دُگّان</title>
    <!-- إعدادات PWA وملائمة الشاشة -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#16a34a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="دُگّان">
    <link rel="apple-touch-icon" href="./icon-192.png">

    <!-- تطبيق المظهر الليلي والتقاط حدث التثبيت مبكراً -->
    <script>
        if (localStorage.getItem('daggan_theme') === 'dark') {
            document.documentElement.classList.add('dark');
        }
        window.__deferredInstallPrompt = null;
        window.addEventListener('beforeinstallprompt', function(e) {
            e.preventDefault();
            window.__deferredInstallPrompt = e;
            if (typeof window.onInstallPromptReady === 'function') {
                window.onInstallPromptReady();
            }
        });
    </script>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Cairo -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <!-- Supabase JS SDK v2 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { cairo: ['Cairo', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        * {
            -webkit-tap-highlight-color: transparent;
        }
        button, a, input, select, label {
            touch-action: manipulation;
        }
        html, body {
            width: 100%;
            max-width: 100%;
            overflow-x: hidden;
            font-family: 'Cairo', sans-serif;
            overscroll-behavior-y: contain;
        }
        input, button {
            font-size: 16px !important;
        }
        .safe-area-pad {
            padding-top: max(1rem, env(safe-area-inset-top, 1rem));
            padding-bottom: max(1.5rem, env(safe-area-inset-bottom, 1.5rem));
        }
        @media print {
            .no-print { display: none !important; }
        }
    </style>
</head>
<body class="bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-[100dvh] flex flex-col px-4 safe-area-pad antialiased selection:bg-emerald-500 selection:text-white">

    <!-- Background Decorative Blobs -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none">
        <div class="absolute -top-24 -right-24 w-96 h-96 bg-emerald-500/15 rounded-full blur-3xl"></div>
        <div class="absolute -bottom-24 -left-24 w-96 h-96 bg-teal-500/15 rounded-full blur-3xl"></div>
    </div>

    <!-- Main Auth Card -->
    <div class="w-full max-w-md my-auto mx-auto bg-white dark:bg-slate-800 rounded-3xl shadow-2xl border border-slate-100 dark:border-slate-700 overflow-hidden relative z-10">
        
        <!-- Top Brand Header -->
        <div class="bg-gradient-to-br from-slate-900 via-slate-800 to-emerald-950 text-white p-6 sm:p-7 text-center relative overflow-hidden">
            <button type="button" onclick="toggleLoginTheme()" class="absolute top-4 left-4 w-10 h-10 rounded-xl bg-white/10 active:scale-95 text-slate-200 flex items-center justify-center transition" title="تبديل المظهر">
                <i id="loginThemeIcon" class="fa-solid fa-moon text-sm"></i>
            </button>
            <div class="absolute -left-8 -bottom-8 w-32 h-32 bg-emerald-500/20 rounded-full blur-2xl pointer-events-none"></div>
            <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-emerald-500 to-teal-400 flex items-center justify-center text-white shadow-lg shadow-emerald-900/40 mx-auto mb-3">
                <i class="fa-solid fa-cart-shopping text-2xl"></i>
            </div>
            <h1 class="font-black text-xl tracking-tight">نظام دُگّان للمشتريات</h1>
            <p class="text-xs text-slate-300 mt-1">إدارة المواد، المصروفات اليومية، والتحاسب الدوري</p>
            <div id="serverBadge" class="mt-3 inline-flex items-center gap-1.5 text-[11px] px-3 py-1 rounded-full bg-white/10 text-emerald-300 font-semibold">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                <span>متصل بسيرفر Supabase</span>
            </div>
        </div>

        <!-- Warning if Supabase keys are not filled yet -->
        <div id="configWarningBox" class="mx-6 mt-4 p-3 rounded-2xl bg-amber-50 dark:bg-amber-950/60 border border-amber-200 dark:border-amber-800 text-amber-800 dark:text-amber-200 text-xs hidden space-y-1">
            <div class="font-bold flex items-center gap-1.5">
                <i class="fa-solid fa-triangle-exclamation text-amber-600 dark:text-amber-400"></i>
                <span>تنبيه إعداد السيرفر:</span>
            </div>
            <p>يرجى ضبط مفاتيح الاتصال في ملف <code class="bg-amber-100 dark:bg-amber-900 px-1 rounded">supabase-config.js</code>.</p>
        </div>

        <!-- Mode Switcher Tabs -->
        <div class="p-6 pb-0">
            <div class="flex bg-slate-100 dark:bg-slate-700/70 p-1.5 rounded-2xl shadow-inner">
                <button type="button" onclick="switchAuthTab('login')" id="authTab-login" class="flex-1 py-2.5 rounded-xl font-bold text-sm transition bg-white dark:bg-slate-800 text-emerald-600 dark:text-emerald-400 shadow-sm">
                    تسجيل الدخول
                </button>
                <button type="button" onclick="switchAuthTab('register')" id="authTab-register" class="flex-1 py-2.5 rounded-xl font-bold text-sm transition text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white">
                    إنشاء حساب جديد
                </button>
            </div>
        </div>

        <!-- Error / Alert Box -->
        <div id="authAlert" class="mx-6 mt-4 p-3 rounded-2xl bg-rose-50 dark:bg-rose-950/60 border border-rose-200 dark:border-rose-800 text-rose-700 dark:text-rose-300 text-xs font-bold hidden flex items-center gap-2">
            <i class="fa-solid fa-circle-exclamation text-sm shrink-0"></i>
            <span id="authAlertText"></span>
        </div>

        <!-- LOGIN FORM -->
        <form id="loginForm" onsubmit="handleLogin(event)" class="p-6 space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1.5">البريد الإلكتروني أو اسم المستخدم *</label>
                <div class="relative">
                    <i class="fa-solid fa-user absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                    <input type="text" id="loginUsername" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required placeholder="أدخل البريد أو اسم المستخدم..." class="w-full min-h-[48px] bg-slate-50 dark:bg-slate-700 dark:text-white border border-slate-200 dark:border-slate-600 rounded-2xl pr-11 pl-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1.5">كلمة المرور *</label>
                <div class="relative">
                    <i class="fa-solid fa-lock absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                    <input type="password" id="loginPassword" autocomplete="current-password" required placeholder="••••••••" class="w-full min-h-[48px] bg-slate-50 dark:bg-slate-700 dark:text-white border border-slate-200 dark:border-slate-600 rounded-2xl pr-11 pl-11 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                    <button type="button" onclick="togglePasswordVisibility('loginPassword', 'loginEyeIcon')" class="absolute left-3 top-1/2 -translate-y-1/2 w-9 h-9 flex items-center justify-center text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
                        <i id="loginEyeIcon" class="fa-solid fa-eye text-sm"></i>
                    </button>
                </div>
            </div>

            <button type="submit" id="loginSubmitBtn" class="w-full min-h-[48px] bg-emerald-600 active:scale-[0.99] hover:bg-emerald-700 text-white font-bold py-3.5 rounded-2xl transition text-sm shadow-lg shadow-emerald-200 dark:shadow-none flex items-center justify-center gap-2">
                <i class="fa-solid fa-right-to-bracket"></i>
                <span>دخول للنظام</span>
            </button>

            <div class="pt-2 border-t border-slate-100 dark:border-slate-700 text-center">
                <button type="button" onclick="demoLogin()" class="text-xs font-bold text-slate-500 dark:text-slate-400 hover:text-emerald-600 dark:hover:text-emerald-400 transition py-1">
                    أو الدخول بدون إنترنت (وضع محلي تجريبي) ←
                </button>
            </div>
        </form>

        <!-- REGISTER FORM -->
        <form id="registerForm" onsubmit="handleRegister(event)" class="p-6 space-y-3.5 hidden">
            <div>
                <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">الاسم الكامل *</label>
                <div class="relative">
                    <i class="fa-solid fa-id-card absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                    <input type="text" id="regFullName" required placeholder="مثلاً: مرتضى حسين" class="w-full min-h-[46px] bg-slate-50 dark:bg-slate-700 dark:text-white border border-slate-200 dark:border-slate-600 rounded-2xl pr-11 pl-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">اسم المطعم / المشروع *</label>
                <div class="relative">
                    <i class="fa-solid fa-store absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                    <input type="text" id="regProjectName" required placeholder="مثلاً: مطعم دُگّان" class="w-full min-h-[46px] bg-slate-50 dark:bg-slate-700 dark:text-white border border-slate-200 dark:border-slate-600 rounded-2xl pr-11 pl-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">البريد الإلكتروني أو اسم المستخدم *</label>
                <div class="relative">
                    <i class="fa-solid fa-user absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                    <input type="text" id="regUsername" autocapitalize="none" autocorrect="off" spellcheck="false" required placeholder="name@example.com أو اسم مستخدم" class="w-full min-h-[46px] bg-slate-50 dark:bg-slate-700 dark:text-white border border-slate-200 dark:border-slate-600 rounded-2xl pr-11 pl-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                </div>
            </div>

            <!-- ميزة رفع الصورة الشخصية مع الضغط التلقائي -->
            <div>
                <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">الصورة الشخصية (اختياري)</label>
                <input type="file" id="regAvatar" accept="image/*" class="w-full bg-slate-50 dark:bg-slate-700 dark:text-slate-200 border border-slate-200 dark:border-slate-600 rounded-2xl px-3 py-2 text-xs file:mr-3 file:py-1.5 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-emerald-50 dark:file:bg-emerald-950 file:text-emerald-700 dark:file:text-emerald-300">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">كلمة المرور *</label>
                <div class="relative">
                    <i class="fa-solid fa-lock absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                    <input type="password" id="regPassword" autocomplete="new-password" required minlength="6" placeholder="6 أحرف أو أرقام على الأقل" class="w-full min-h-[46px] bg-slate-50 dark:bg-slate-700 dark:text-white border border-slate-200 dark:border-slate-600 rounded-2xl pr-11 pl-11 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                    <button type="button" onclick="togglePasswordVisibility('regPassword', 'regEyeIcon1')" class="absolute left-3 top-1/2 -translate-y-1/2 w-9 h-9 flex items-center justify-center text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
                        <i id="regEyeIcon1" class="fa-solid fa-eye text-sm"></i>
                    </button>
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">تأكيد كلمة المرور *</label>
                <div class="relative">
                    <i class="fa-solid fa-shield-halved absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                    <input type="password" id="regConfirmPassword" autocomplete="new-password" required minlength="6" placeholder="أعد كتابة كلمة المرور" class="w-full min-h-[46px] bg-slate-50 dark:bg-slate-700 dark:text-white border border-slate-200 dark:border-slate-600 rounded-2xl pr-11 pl-11 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                    <button type="button" onclick="togglePasswordVisibility('regConfirmPassword', 'regEyeIcon2')" class="absolute left-3 top-1/2 -translate-y-1/2 w-9 h-9 flex items-center justify-center text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
                        <i id="regEyeIcon2" class="fa-solid fa-eye text-sm"></i>
                    </button>
                </div>
            </div>

            <div class="pt-2">
                <button type="submit" id="regSubmitBtn" class="w-full min-h-[48px] bg-emerald-600 active:scale-[0.99] hover:bg-emerald-700 text-white font-bold py-3.5 rounded-2xl transition text-sm shadow-lg shadow-emerald-200 dark:shadow-none flex items-center justify-center gap-2">
                    <i class="fa-solid fa-user-plus"></i>
                    <span>إنشاء الحساب والدخول</span>
                </button>
            </div>
        </form>

    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed top-6 left-1/2 -translate-x-1/2 bg-slate-900 text-white px-5 py-3 rounded-2xl shadow-2xl flex items-center gap-3 -translate-y-28 opacity-0 transition-all duration-300 z-50 text-sm whitespace-nowrap max-w-[92vw]">
        <i class="fa-solid fa-check-circle text-emerald-400 text-lg shrink-0"></i>
        <span id="toastMessage" class="truncate">تم بنجاح</span>
    </div>

    <script>
        const DEMO_SESSION_KEY = 'restaurant_procurement_demo_mode';
        const INSTALL_DONE_KEY = 'daggan_pwa_v5_installed';
        const DEFAULT_AVATAR_SVG = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" rx="50" fill="%2316a34a"/><text x="50" y="65" font-size="45" text-anchor="middle" fill="white">👤</text></svg>';

        function updateThemeIcon() {
            const icon = document.getElementById('loginThemeIcon');
            if (!icon) return;
            const isDark = document.documentElement.classList.contains('dark');
            icon.className = isDark ? 'fa-solid fa-sun text-sm text-amber-300' : 'fa-solid fa-moon text-sm';
        }

        function toggleLoginTheme() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('daggan_theme', isDark ? 'dark' : 'light');
            updateThemeIcon();
        }

        function normalizeEmailInput(rawInput) {
            const cleaned = rawInput.trim().toLowerCase();
            if (cleaned.includes('@')) return cleaned;
            const latinOnly = cleaned.replace(/[^a-z0-9._-]/g, '');
            if (latinOnly.length >= 2 && latinOnly.length === cleaned.length) {
                return `${latinOnly}@procurement.app`;
            }
            const hexEncoded = Array.from(cleaned)
                .map(ch => ch.codePointAt(0).toString(16))
                .join('');
            return `u_${hexEncoded}@procurement.app`;
        }

        function compressAvatarFile(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        const maxDim = 200;
                        const scale = Math.min(maxDim / img.width, maxDim / img.height, 1);
                        canvas.width = Math.round(img.width * scale);
                        canvas.height = Math.round(img.height * scale);
                        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                        const dataUrl = canvas.toDataURL('image/jpeg', 0.75);
                        canvas.toBlob((blob) => {
                            resolve({ blob, dataUrl });
                        }, 'image/jpeg', 0.75);
                    };
                    img.onerror = () => resolve({ blob: file, dataUrl: '' });
                    img.src = e.target.result;
                };
                reader.onerror = () => resolve({ blob: file, dataUrl: '' });
                reader.readAsDataURL(file);
            });
        }

        window.onload = async function() {
            updateThemeIcon();
            initPwaInstallPrompt();

            if (typeof supabaseClient === 'undefined' || !supabaseClient) {
                document.getElementById('configWarningBox').classList.remove('hidden');
                document.getElementById('serverBadge').innerHTML = `
                    <span class="w-2 h-2 rounded-full bg-amber-400"></span>
                    <span class="text-amber-200">بانتظار ربط مفاتيح Supabase</span>
                `;
                return;
            }
            try {
                const { data: { session } } = await supabaseClient.auth.getSession();
                if (session) {
                    window.location.href = 'index.html';
                }
            } catch (e) {}
        };

        function switchAuthTab(tab) {
            hideAlert();
            const loginBtn = document.getElementById('authTab-login');
            const regBtn = document.getElementById('authTab-register');
            const loginForm = document.getElementById('loginForm');
            const regForm = document.getElementById('registerForm');

            if (tab === 'login') {
                loginBtn.className = "flex-1 py-2.5 rounded-xl font-bold text-sm transition bg-white dark:bg-slate-800 text-emerald-600 dark:text-emerald-400 shadow-sm";
                regBtn.className = "flex-1 py-2.5 rounded-xl font-bold text-sm transition text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white";
                loginForm.classList.remove('hidden');
                regForm.classList.add('hidden');
            } else {
                regBtn.className = "flex-1 py-2.5 rounded-xl font-bold text-sm transition bg-white dark:bg-slate-800 text-emerald-600 dark:text-emerald-400 shadow-sm";
                loginBtn.className = "flex-1 py-2.5 rounded-xl font-bold text-sm transition text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white";
                regForm.classList.remove('hidden');
                loginForm.classList.add('hidden');
            }
        }

        function togglePasswordVisibility(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }

        function showAlert(msg) {
            const box = document.getElementById('authAlert');
            document.getElementById('authAlertText').innerText = msg;
            box.classList.remove('hidden');
        }

        function hideAlert() { document.getElementById('authAlert').classList.add('hidden'); }

        function setButtonLoading(btnId, isLoading, defaultHtml) {
            const btn = document.getElementById(btnId);
            btn.disabled = isLoading;
            btn.innerHTML = isLoading ? `<i class="fa-solid fa-spinner fa-spin"></i><span>جاري الاتصال بالسيرفر...</span>` : defaultHtml;
        }

        async function handleRegister(e) {
            e.preventDefault();
            hideAlert();
            if (typeof supabaseClient === 'undefined' || !supabaseClient) { showAlert("يرجى إعداد مفاتيح Supabase أولاً."); return; }

            const fullName = document.getElementById('regFullName').value.trim();
            const projectName = document.getElementById('regProjectName').value.trim();
            const rawUsername = document.getElementById('regUsername').value.trim();
            const password = document.getElementById('regPassword').value;
            const confirmPassword = document.getElementById('regConfirmPassword').value;
            const avatarInput = document.getElementById('regAvatar');

            if (password !== confirmPassword) { showAlert("كلمتا المرور غير متطابقتين!"); return; }

            const email = normalizeEmailInput(rawUsername);
            const defaultBtnHtml = `<i class="fa-solid fa-user-plus"></i><span>إنشاء الحساب والدخول</span>`;
            setButtonLoading('regSubmitBtn', true, defaultBtnHtml);

            try {
                let publicAvatarUrl = '';
                let fallbackDataUrl = '';
                if (avatarInput.files && avatarInput.files[0]) {
                    const { blob, dataUrl } = await compressAvatarFile(avatarInput.files[0]);
                    fallbackDataUrl = dataUrl;
                    const fileName = `user_${Date.now()}.jpg`;
                    const { error: uploadError } = await supabaseClient.storage
                        .from('avatars')
                        .upload(fileName, blob, { contentType: 'image/jpeg', upsert: true });
                    if (!uploadError) {
                        const { data: urlData } = supabaseClient.storage.from('avatars').getPublicUrl(fileName);
                        publicAvatarUrl = urlData.publicUrl;
                    }
                }

                const { data, error } = await supabaseClient.auth.signUp({
                    email: email,
                    password: password,
                    options: {
                        data: {
                            full_name: fullName,
                            project_name: projectName,
                            username: rawUsername,
                            avatar_url: publicAvatarUrl
                        }
                    }
                });
                if (error) throw error;

                localStorage.removeItem(DEMO_SESSION_KEY);
                const finalAvatar = publicAvatarUrl || fallbackDataUrl;

                if (data.session && data.user) {
                    await supabaseClient.from('profiles').upsert({
                        id: data.user.id,
                        full_name: fullName,
                        project_name: projectName,
                        avatar_url: finalAvatar,
                        theme: localStorage.getItem('daggan_theme') || 'light',
                        lang: localStorage.getItem('daggan_lang') || 'ar',
                        updated_at: new Date().toISOString()
                    });
                    showToast("تم إنشاء الحساب بنجاح! جاري الدخول...");
                    setTimeout(() => { window.location.href = 'index.html'; }, 700);
                } else {
                    showToast("تم إنشاء الحساب! يرجى تأكيد البريد الإلكتروني ثم تسجيل الدخول.");
                    switchAuthTab('login');
                    document.getElementById('loginUsername').value = rawUsername;
                }
            } catch (err) {
                let msg = err.message || "حدث خطأ أثناء إنشاء الحساب.";
                if (msg.includes("User already registered")) msg = "هذا الحساب مسجل مسبقاً، يرجى تسجيل الدخول.";
                showAlert(msg);
            } finally {
                setButtonLoading('regSubmitBtn', false, defaultBtnHtml);
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            hideAlert();
            if (typeof supabaseClient === 'undefined' || !supabaseClient) { showAlert("يرجى إعداد مفاتيح Supabase أولاً."); return; }

            const rawUsername = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value;
            const email = normalizeEmailInput(rawUsername);

            const defaultBtnHtml = `<i class="fa-solid fa-right-to-bracket"></i><span>دخول للنظام</span>`;
            setButtonLoading('loginSubmitBtn', true, defaultBtnHtml);

            try {
                const { data, error } = await supabaseClient.auth.signInWithPassword({ email: email, password: password });
                if (error) throw error;

                localStorage.removeItem(DEMO_SESSION_KEY);
                showToast("تم تسجيل الدخول بنجاح!");
                setTimeout(() => { window.location.href = 'index.html'; }, 500);
            } catch (err) {
                let msg = err.message || "بيانات الدخول غير صحيحة.";
                if (msg.includes("Invalid login credentials")) msg = "اسم المستخدم أو كلمة المرور غير صحيحة.";
                else if (msg.includes("Email not confirmed")) msg = "يرجى تأكيد البريد الإلكتروني أولاً قبل تسجيل الدخول.";
                showAlert(msg);
            } finally {
                setButtonLoading('loginSubmitBtn', false, defaultBtnHtml);
            }
        }

        function demoLogin() {
            localStorage.setItem(DEMO_SESSION_KEY, 'true');
            showToast("تم تفعيل الوضع المحلي التجريبي...");
            setTimeout(() => { window.location.href = 'index.html'; }, 500);
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMessage').innerText = message;
            toast.classList.remove('-translate-y-28', 'opacity-0');
            setTimeout(() => { toast.classList.add('-translate-y-28', 'opacity-0'); }, 3000);
        }

        // --- PWA Service Worker & Smart Install Banner ---
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(() => {});
            });
        }

        function isRunningStandalone() {
            return (
                window.matchMedia('(display-mode: standalone)').matches ||
                window.matchMedia('(display-mode: fullscreen)').matches ||
                window.navigator.standalone === true ||
                document.referrer.includes('android-app://')
            );
        }

        async function isAppAlreadyInstalled() {
            if (isRunningStandalone()) {
                localStorage.setItem(INSTALL_DONE_KEY, 'true');
                return true;
            }
            if (localStorage.getItem(INSTALL_DONE_KEY) === 'true') {
                return true;
            }
            if ('getInstalledRelatedApps' in navigator) {
                try {
                    const related = await navigator.getInstalledRelatedApps();
                    if (related && related.length > 0) {
                        localStorage.setItem(INSTALL_DONE_KEY, 'true');
                        return true;
                    }
                } catch (e) {}
            }
            return false;
        }

        window.onInstallPromptReady = function() {
            if (!isRunningStandalone() && localStorage.getItem(INSTALL_DONE_KEY) !== 'true') {
                showInstallPromptBanner();
            }
        };

        window.addEventListener('appinstalled', () => {
            localStorage.setItem(INSTALL_DONE_KEY, 'true');
            window.__deferredInstallPrompt = null;
            const banner = document.getElementById('pwa-install-banner');
            if (banner) banner.remove();
        });

        async function initPwaInstallPrompt() {
            const installed = await isAppAlreadyInstalled();
            if (installed) return;
            if (sessionStorage.getItem('daggan_install_banner_dismissed') === 'true') return;

            setTimeout(async () => {
                if (!(await isAppAlreadyInstalled())) {
                    showInstallPromptBanner();
                }
            }, 600);
        }

        function showInstallPromptBanner() {
            if (document.getElementById('pwa-install-banner') || isRunningStandalone()) return;
            const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);

            const banner = document.createElement('div');
            banner.id = 'pwa-install-banner';
            banner.className = 'no-print';
            banner.style.cssText = 'position: fixed; bottom: calc(env(safe-area-inset-bottom, 0px) + 14px); left: 12px; right: 12px; max-width: 440px; margin: 0 auto; z-index: 40;';
            banner.innerHTML = `
                <div style="background: #0f172a; color: #fff; padding: 13px; border-radius: 20px; box-shadow: 0 12px 30px rgba(0,0,0,0.45); border: 1px solid rgba(255,255,255,0.15);">
                    <div style="display: flex; justify-content: space-between; align-items: center; gap: 10px;">
                        <div style="display: flex; align-items: center; gap: 10px; min-width: 0;">
                            <img src="./icon-192.png" onerror="this.onerror=null;this.src=DEFAULT_AVATAR_SVG" style="width: 42px; height: 42px; border-radius: 12px; object-fit: cover; flex-shrink: 0;">
                            <div style="min-width: 0;">
                                <div style="font-weight: 800; font-size: 13px;">تثبيت تطبيق دُگّان على هاتفك</div>
                                <div style="font-size: 11px; color: #94a3b8;">يعمل بملء الشاشة كتطبيق مستقل وبسرعة عالية</div>
                            </div>
                        </div>
                        <div style="display: flex; gap: 6px; flex-shrink: 0;">
                            <button type="button" id="pwaInstallConfirmBtn" style="background: #16a34a; color: #fff; border: none; padding: 9px 13px; border-radius: 12px; cursor: pointer; font-weight: bold; font-size: 13px;">تثبيت</button>
                            <button type="button" id="pwaInstallDismissBtn" style="background: rgba(255,255,255,0.12); color: #cbd5e1; border: none; padding: 9px 11px; border-radius: 12px; cursor: pointer; font-size: 13px;">✕</button>
                        </div>
                    </div>
                    <div id="pwaManualInstallGuide" style="display: none; margin-top: 10px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,0.12); font-size: 12px; color: #e2e8f0; line-height: 1.6;">
                        ${isIOS
                            ? '• في متصفح <b>Safari</b>: اضغط على زر <b>المشاركة (Share)</b> أسفل الشاشة ثم اختر <b>"إضافة إلى الشاشة الرئيسية" (Add to Home Screen)</b>.'
                            : '• في متصفح <b>Chrome</b>: اضغط على النقاط الثلاث <b>(⋮)</b> أعلى الشاشة ثم اختر <b>"تثبيت التطبيق"</b> أو <b>"الإضافة إلى الشاشة الرئيسية"</b>.'
                        }
                    </div>
                </div>`;
            document.body.appendChild(banner);

            document.getElementById('pwaInstallConfirmBtn').addEventListener('click', async () => {
                const promptEvent = window.__deferredInstallPrompt;
                if (promptEvent) {
                    promptEvent.prompt();
                    const { outcome } = await promptEvent.userChoice;
                    if (outcome === 'accepted') {
                        localStorage.setItem(INSTALL_DONE_KEY, 'true');
                        banner.remove();
                    }
                    window.__deferredInstallPrompt = null;
                } else {
                    const guide = document.getElementById('pwaManualInstallGuide');
                    if (guide) guide.style.display = 'block';
                }
            });

            document.getElementById('pwaInstallDismissBtn').addEventListener('click', () => {
                sessionStorage.setItem('daggan_install_banner_dismissed', 'true');
                banner.remove();
            });
        }
    </script>
</body>
</html>
